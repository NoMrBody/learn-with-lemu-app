<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Problems — Sightlines</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%23F2F4F3%22/%3E%3Cpath d=%22M6 22 L16 6 L26 22 Z%22 fill=%22none%22 stroke=%22%232B4FE8%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3Cline x1=%2216%22 y1=%226%22 x2=%2216%22 y2=%2222%22 stroke=%22%23E8442A%22 stroke-width=%222%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<meta name="theme-color" content="#F2F4F3">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>

  .katex .mord.mathnormal,.katex .mathit,.katex .mathdefault{
    font-family:"IBM Plex Mono",monospace;font-style:italic;font-weight:500}
  .katex .mord{font-family:"IBM Plex Mono",monospace}
  .katex .mop,.katex .mbin,.katex .mrel,.katex .mopen,.katex .mclose,.katex .mpunct{
    font-family:"IBM Plex Sans",sans-serif}

</style>
<style>
/* make KaTeX speak the same language as the rest of the page */
.katex{font-size:1em;font-family:"IBM Plex Mono",monospace}
.katex .mathnormal,.katex .mathit,.katex .mathdefault{
  font-family:"IBM Plex Mono",monospace;font-style:italic;font-weight:500}
.katex .mord.text,.katex .mop{font-family:"IBM Plex Sans",sans-serif;font-style:normal}
.katex .mord{font-family:"IBM Plex Mono",monospace}
.katex .frac-line{border-bottom-width:.055em}

<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F4F3; --card:#FFFFFF; --hair:#DCE3E0;
  --ink:#14181A; --ink-2:#5A6560; --ink-3:#8B958F;
  /* four roles on the figure, four colours */
  --given:#5A6560;   --given-d:#3E4744;                  /* stated in the problem */
  --found:#2B4FE8;   --found-d:#2340C4; --found-l:#E9EDFD; /* you worked it out   */
  --built:#E39A22;   --built-d:#8F5F12;                  /* you drew it in       */
  --target:#E8442A;  --target-d:#C4331C; --target-l:#FDECE8;
  /* aliases kept so nothing else has to change */
  --blue:#2B4FE8; --blue-d:#2340C4; --blue-l:#E9EDFD;
  --red:#E8442A;  --red-d:#C4331C;  --red-l:#FDECE8;
  --amber:#E39A22; --amber-d:#8F5F12;
  --tk-line:#F7D3CB; --tk-bg:#FDECE8; --tk-field:#FFFFFF;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper)}
body{opacity:0;animation:pagein .5s ease forwards;color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:16.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased}
@keyframes pagein{to{opacity:1}}
.katex{font-size:1.06em;font-family:"IBM Plex Mono","KaTeX_Main",monospace}
.katex .mord.mathnormal,.katex .mathit{font-family:"IBM Plex Mono",monospace;font-style:italic}
.katex .mord{font-family:"IBM Plex Mono",monospace}
.katex-display{margin:0}
/* an equation is something the page says, not something it quotes */
.math{background:none;border:none;border-radius:0;padding:6px 0 4px;margin:2px 0 12px;
  overflow-x:auto;text-align:left;color:var(--blue-d)}
.math .katex{font-size:1.16em}
em.q{font-style:italic;font-family:"IBM Plex Mono",monospace;font-weight:500}

/* ---------- layout ---------- */
#shell{display:flex;flex-direction:column;min-height:100dvh}
#stage{position:sticky;top:0;z-index:5;height:44dvh;min-height:250px;touch-action:none;overflow:hidden;
  background-color:#F2F4F3;
  background-image:
    repeating-linear-gradient(60deg,  rgba(20,24,26,.05) 0 1px, transparent 1px 42px),
    repeating-linear-gradient(-60deg, rgba(20,24,26,.05) 0 1px, transparent 1px 42px),
    repeating-linear-gradient(0deg,   rgba(20,24,26,.035) 0 1px, transparent 1px 36.4px)}
#stage canvas{display:block;width:100%;height:100%}
#layer{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#layer .pin{pointer-events:auto}
#col{flex:0 0 auto;padding:52px 20px 40px;max-width:660px;margin:0 auto;width:100%}
@media(min-width:960px){
  #shell{flex-direction:row;align-items:flex-start}
  #stage{height:100dvh;flex:1 1 52%;align-self:flex-start;border-right:1px solid var(--hair)}
  #col{flex:0 0 48%;max-width:620px;min-height:100dvh;padding:60px 40px 50px}
}

/* ---------- pins ---------- */
.pin{position:absolute;transform:translate(-50%,-50%);
  width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:12.5px;color:var(--ink-2);
  cursor:pointer;user-select:none;border:1px solid #D3DAD6;background:rgba(250,251,250,.82);
  backdrop-filter:blur(6px);transition:transform .16s cubic-bezier(.2,.9,.3,1.4),background .16s,border-color .16s}
.pin:hover{transform:translate(-50%,-50%) scale(1.14);border-color:var(--blue)}
.pin.new{animation:popin .5s cubic-bezier(.2,.9,.3,1.5)}
@keyframes popin{0%{transform:translate(-50%,-50%) scale(0);opacity:0}
  100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
.pin.on{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 0 0 6px rgba(43,79,232,.14)}
.len{position:absolute;transform:translate(-50%,-50%);font-family:"IBM Plex Mono",monospace;
  font-weight:600;font-size:14px;white-space:nowrap;letter-spacing:-.01em;
  color:var(--found-d);
  text-shadow:0 0 4px #F2F4F3,0 0 4px #F2F4F3,0 0 8px #F2F4F3,0 0 8px #F2F4F3;
  transition:color .4s}
.len.given{color:var(--given-d)}
.len.tgt{color:var(--target-d)}
.len.fresh{animation:ping .8s ease}
@keyframes ping{0%{transform:translate(-50%,-50%) scale(1.9);color:var(--target)}
  100%{transform:translate(-50%,-50%) scale(1)}}
#hint3d{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);pointer-events:none;transition:opacity .5s}

/* ---------- header ---------- */
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink-3);margin:0 0 12px;font-weight:500}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:clamp(28px,5.4vw,40px);
  line-height:1.02;margin:0 0 12px;letter-spacing:-.028em}
.promise{color:var(--ink-2);font-size:16.5px;margin:0 0 30px;max-width:46ch}
.promise b{color:var(--ink);font-weight:600}

/* ---------- problem picker ---------- */
.picker{display:flex;gap:0;flex-wrap:wrap;margin:0 0 30px;border-bottom:1px solid var(--hair)}
.pk{background:none;border:none;border-bottom:2px solid transparent;padding:9px 14px 11px;
  font-family:"IBM Plex Sans",sans-serif;font-size:14px;color:var(--ink-3);cursor:pointer;
  margin-bottom:-1px;transition:color .15s,border-color .15s}
.pk:hover{color:var(--ink)}
.pk.on{color:var(--ink);border-bottom-color:var(--red);font-weight:600}
.pk .tick{color:var(--blue);margin-left:6px;font-size:12px}

/* ---------- statement: this is an exam question ---------- */
.stmt{margin:0 0 22px}
.stmt p{margin:0 0 16px;font-size:19px;line-height:1.5;color:var(--ink);letter-spacing:-.006em}
.stmt .katex{font-size:1.02em}
.given{display:flex;flex-wrap:wrap;gap:16px;align-items:baseline;
  padding-top:14px;border-top:1px solid var(--hair)}
.gv{font-size:16px;color:var(--ink-2)}
.gv .katex{color:var(--ink)}
.findline{display:block;width:100%;margin-top:4px;font-size:16px;color:var(--red-d);font-weight:500}

/* ---------- half-drawn note ---------- */
.halfdrawn{font-size:15.5px;color:var(--ink-2);line-height:1.55;margin:0 0 26px;
  padding-left:15px;border-left:2px solid var(--amber)}
.halfdrawn b{color:var(--ink);font-weight:600}

/* ---------- ask before tell ---------- */
.ask{margin:0 0 14px;padding-left:15px;border-left:2px solid var(--blue)}
.askhead{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:17px;
  margin:0 0 12px;color:var(--ink);letter-spacing:-.015em;line-height:1.3}
.askopts{display:flex;flex-direction:column;gap:6px}
.askopt{background:none;border:1px solid var(--hair);border-radius:10px;padding:11px 14px;
  font-family:inherit;font-size:15.5px;color:var(--ink);text-align:left;cursor:pointer;
  transition:transform .13s,border-color .13s,background .13s}
.askopt:hover:not(:disabled){transform:translateX(3px);border-color:var(--blue);background:var(--blue-l)}
.askopt:disabled{cursor:default}
.askopt.right{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.askopt.wrong{opacity:.45}
.askv:empty{display:none}
.askgood{margin-top:12px;font-size:15.5px;color:var(--blue-d);line-height:1.5}
.askbad{margin-top:12px;font-size:15.5px;color:var(--red-d);line-height:1.5}
.skip{margin-top:12px;background:none;border:none;color:var(--ink-3);
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;cursor:pointer;padding:0}
.skip:hover{color:var(--ink-2);text-decoration:underline}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none}

/* ---------- the student's own scratchpad ---------- */
#tray{margin:0 0 26px}
.trayh{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--amber-d);margin:0 0 10px;font-weight:500}
#trayin{display:flex;flex-direction:column;gap:10px}

/* ---------- the two doors ---------- */
.doors{display:flex;flex-direction:column;gap:8px;margin:0 0 22px}
.door{background:none;border:1px solid var(--hair);border-radius:12px;padding:15px 17px;
  text-align:left;font-family:inherit;cursor:pointer;
  transition:transform .16s cubic-bezier(.2,.9,.3,1.2),border-color .16s,background .16s}
.door:hover{transform:translateY(-2px);border-color:var(--red);background:var(--red-l)}
.door b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:17px;
  font-weight:700;margin-bottom:2px;letter-spacing:-.015em}
.door span{display:block;font-size:14.5px;color:var(--ink-2);line-height:1.42}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 16px}
.opt{background:none;border:1px solid var(--hair);border-radius:12px;padding:18px 10px;
  font-size:18px;cursor:pointer;transition:transform .14s,border-color .14s,background .14s}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--blue);background:var(--blue-l)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--blue);background:var(--blue-l);box-shadow:inset 0 0 0 1px var(--blue)}
.opt.wrong{opacity:.42}
.verdict{margin:0 0 16px;font-size:16px;line-height:1.55;padding-left:15px}
.verdict.good{border-left:2px solid var(--blue);color:var(--ink-2)}
.verdict.bad{border-left:2px solid var(--red);color:var(--ink-2)}
.verdict b{color:var(--ink);font-weight:600}
.askq{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:19px;
  margin:0 0 14px;letter-spacing:-.018em}

/* ---------- toolbelt ---------- */
.belt{margin:0 0 26px}
.belt h3{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink-3);margin:0 0 10px;font-weight:500}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.tool{display:flex;align-items:center;gap:7px;border-radius:20px;padding:6px 13px;
  font-size:13.5px;color:var(--ink-3);background:none;border:1px solid var(--hair);
  transition:all .35s cubic-bezier(.2,.9,.3,1.3)}
.tool .dot{width:5px;height:5px;border-radius:50%;background:var(--hair);flex:0 0 5px;transition:background .3s}
.tool.got{border-color:var(--blue);color:var(--blue-d);font-weight:600;
  animation:unlock .5s cubic-bezier(.2,.9,.3,1.4)}
.tool.got .dot{background:var(--blue)}
@keyframes unlock{0%{transform:scale(.92)}55%{transform:scale(1.06)}100%{transform:scale(1)}}

/* ---------- steps ---------- */
.step{margin:0 0 30px;animation:rise .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.step .head{display:flex;align-items:baseline;gap:11px;margin-bottom:10px}
.step .n{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3);flex:0 0 auto}
.step .t{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:20px;
  letter-spacing:-.02em;line-height:1.15}
.step p{margin:0 0 14px;font-size:16.5px;color:var(--ink-2);line-height:1.55}
.step p b{color:var(--ink);font-weight:600}
.math{margin:18px 0;text-align:center;font-size:19px;overflow-x:auto;padding:2px 0}
.board{margin:0 0 14px}
.board .bh{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:6px;display:flex;align-items:center;gap:7px}
.board svg{display:block;width:100%;height:auto;max-height:190px}
.board.mine .bh{color:var(--amber-d)}
.board.mine .x{margin-left:auto;background:none;border:none;color:var(--ink-3);font-size:15px;
  line-height:1;cursor:pointer;padding:0 2px}
.board.mine .x:hover{color:var(--ink)}
.gotit{display:inline-flex;align-items:center;gap:7px;font-family:"IBM Plex Mono",monospace;
  font-size:13px;color:var(--blue-d);font-weight:500}

/* ---------- the one action ---------- */
.act{position:sticky;bottom:16px;margin:26px 0 0;z-index:6}
.btn{width:100%;background:var(--ink);color:var(--paper);border:none;border-radius:12px;
  padding:15px 20px;font-family:"IBM Plex Sans",sans-serif;font-size:16px;font-weight:600;
  cursor:pointer;box-shadow:0 6px 18px -8px rgba(20,24,26,.5);transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.25)} .btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--hair);box-shadow:none}
.btn.ghost:hover{border-color:var(--ink-3);filter:none}
.hintline{text-align:center;font-size:13.5px;color:var(--ink-3);margin:10px 0 0}

.final{border-top:2px solid var(--red);padding:22px 0 0;margin:26px 0 0;
  animation:rise .4s cubic-bezier(.2,.9,.3,1.2)}
.final .lbl{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--red-d);margin-bottom:12px;font-weight:500}
.final .val{font-size:30px;margin-bottom:14px}
.final .why{color:var(--ink-2);font-size:16px;line-height:1.55;margin:0}

/* ---------- rail ---------- */
#rail{position:fixed;left:0;right:0;top:0;z-index:9998;display:flex;align-items:center;gap:14px;
  padding:11px 16px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;background:linear-gradient(180deg,#F2F4F3 55%,rgba(242,244,243,0));
  pointer-events:none}
#rail a,#rail span{pointer-events:auto}
#rail .home{color:#8B958F;text-decoration:none;white-space:nowrap}
#rail .home:hover{color:#14181A}
#rail .track{flex:1;display:flex;align-items:center;max-width:340px}
#rail .node{width:7px;height:7px;border-radius:50%;background:#CBD3CF;flex:0 0 7px;
  transition:background .3s,box-shadow .3s}
#rail .node.on{background:#E8442A;box-shadow:0 0 0 4px rgba(232,68,42,.16)}
#rail .node.done{background:#2B4FE8}
#rail .seg{flex:1;height:1px;background:#D7DEDA}
#rail .seg.done{background:#93A9E8}
#rail .now{color:#C4331C;white-space:nowrap}
@media(max-width:560px){#rail .now{display:none}}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="shell">
  <div id="stage"><div id="layer"></div><div id="hint3d">drag to turn · tap three points</div></div>
  <div id="col">
    <p class="eyebrow">Solved problems</p>
    <h1 id="title">Nothing here is hard.</h1>
    <p class="promise">Every stereometry problem is a <b>short sequence of things you already know</b>. We take them one at a time, and you collect the tool each step needs.</p>

    <div class="picker" id="picker"></div>
    <div id="stmt"></div>
    <div id="gate"></div>
    <div class="belt" id="belt" hidden><h3>Tools this one needs</h3><div class="tools" id="tools"></div></div>
    <div id="tray" hidden>
      <h3 class="trayh">Your scratchpad</h3>
      <div id="trayin"></div>
    </div>
    <div id="steps"></div>
    <div class="act"><button class="btn" id="go"></button><p class="hintline" id="hintline"></p></div>
  </div>
</div>

<script>
/* track.js — inlined so each page works standalone. Master copy: track.js */
/* ============================================================
   track.js — shared analytics + feedback for all parts
   Loaded by index.html, cuboid.html, problem-dihedral.html, game.html
   ------------------------------------------------------------
   PUBLIC API
     Track.event(name, props)      record something
     Track.part(name)             declare which part this page is
     Track.mountFeedback(el, cfg) render the end-of-part feedback block
     Track.debug()                open the live event panel (or press ` )
   ------------------------------------------------------------
   To go live: set POSTHOG_KEY below. Until then everything is
   buffered locally and visible via the debug panel, so the page
   works with no backend at all.
   ============================================================ */
(function(){
'use strict';

var POSTHOG_KEY = 'phc_khGJHZ5sECXB2bvTVURfwZJ58B4zwQUYSLF3XsESRW2g';
var POSTHOG_HOST = 'https://eu.i.posthog.com';
var STORE = 'sightlines.v1';

/* ---------- identity (no personal data) ---------- */
function uid(){
  return 'v-' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
}
function load(){
  try{ return JSON.parse(localStorage.getItem(STORE)) || {}; }catch(e){ return {}; }
}
function save(o){
  try{ localStorage.setItem(STORE, JSON.stringify(o)); }catch(e){}
}
var mem = load();
if(!mem.visitor){ mem.visitor = uid(); mem.firstSeen = Date.now(); mem.visits = 0; }
if(!mem.parts) mem.parts = {};
if(!mem.session || Date.now() - (mem.lastSeen||0) > 30*60*1000){
  mem.session = uid(); mem.visits = (mem.visits||0) + 1;
}
mem.lastSeen = Date.now();
save(mem);

var ph = null;
var phReady = false;
var pending = [];
var PART = 'unknown';
var queue = [];
var log = [];
var t0 = Date.now();

/* ---------- the one function everything goes through ---------- */
function event(name, props){
  var p = Object.assign({
    part: PART,
    visitor: mem.visitor,
    session: mem.session,
    visit_no: mem.visits,
    returning: mem.visits > 1,
    device: matchMedia('(pointer:coarse)').matches ? 'touch' : 'desktop',
    t_ms: Date.now() - t0
  }, props||{});
  var rec = {name:name, props:p, at:new Date().toISOString()};
  log.push(rec);
  if(POSTHOG_KEY){
    var P = window.posthog;                       // always look it up fresh
    if(phReady && P && typeof P.capture === 'function'){ try{ P.capture(name, p); }catch(e){} }
    else pending.push({name:name, props:p});      // wait for the recorder
  } else queue.push(rec);
  paintDebug();
  return rec;
}

/* ---------- part lifecycle ---------- */
var partStart = Date.now();
function part(name){
  PART = name;
  partStart = Date.now();
  mem.parts[name] = mem.parts[name] || {opened:0, completed:0};
  mem.parts[name].opened++;
  save(mem);
  event('part_open', {opened_before: mem.parts[name].opened - 1});
  event('visit', {visits: mem.visits});
}
function complete(extra){
  mem.parts[PART] = mem.parts[PART] || {opened:1, completed:0};
  mem.parts[PART].completed++;
  save(mem);
  var order = ['explainer','problem','game'];
  var done = order.filter(function(k){ return mem.parts[k] && mem.parts[k].completed; });
  event('part_complete', Object.assign({
    seconds: Math.round((Date.now()-partStart)/1000),
    completed_parts: done.length,
    order_followed: done.join('>') === order.slice(0,done.length).join('>')
  }, extra||{}));
}
addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'hidden'){
    event('part_leave', {seconds: Math.round((Date.now()-partStart)/1000)});
  }
});

/* ============================================================
   feedback block
   ============================================================ */

var styled = false;
function injectCSS(){
  if(styled) return; styled = true;
  var s = document.createElement('style'); s.textContent = CSS; document.head.appendChild(s);
}

function mountFeedback(host, cfg){
  injectCSS();
  cfg = cfg || {};
  var box = document.createElement('div');
  box.className = 'tk-fb';
  box.innerHTML =
    '<b class="tk-h">' + (cfg.title || 'Stay in the loop') + '</b>' +
    '<p class="tk-sub">' + (cfg.sub || 'New topics are on the way. Drop your email and we will tell you when.') + '</p>' +
    '<div class="tk-inline">' +
      '<input type="email" id="tk-mail" placeholder="you@example.com" autocomplete="email">' +
      '<button class="tk-send" id="tk-send">Notify me</button>' +
    '</div>' +
    '<div class="tk-ok tk-hide" id="tk-ok"></div>' +
    '<p class="tk-mini">Or write to <a href="mailto:lemiu2026@gmail.com">lemiu2026@gmail.com</a> \u2014 thoughts, criticism, or a problem you want built. We read everything.</p>';
  host.appendChild(box);

  box.querySelector('#tk-send').onclick = function(){
    var el = box.querySelector('#tk-mail');
    var mail = el ? el.value.trim() : '';
    var valid = /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail);
    event('email_submit', {email_given: valid, email: valid ? mail : '', from_part: PART});
    if(valid){
      try{
        var P = window.posthog;
        if(P && typeof P.identify === 'function') P.identify(mem.visitor, {email:mail});
        else if(P && typeof P.setPersonProperties === 'function') P.setPersonProperties({email:mail});
      }catch(e){}
      mem.email = true; save(mem);
    }
    var ok = box.querySelector('#tk-ok');
    ok.classList.remove('tk-hide');
    ok.textContent = valid ? 'Done \u2014 you will hear from us first.' : 'That email does not look right.';
    if(valid) box.querySelector('#tk-send').disabled = true;
  };
  box.querySelector('#tk-mail').addEventListener('keydown', function(e){
    if(e.key === 'Enter') box.querySelector('#tk-send').click();
  });

  event('feedback_shown');
  return box;
}

/* ---------- share ---------- */
function share(label){
  var url = location.href.split('#')[0];
  event('share_click', {label:label});
  if(navigator.share){
    navigator.share({title:document.title, url:url}).then(function(){
      event('share_done', {method:'native'});
    }).catch(function(){});
  } else if(navigator.clipboard){
    navigator.clipboard.writeText(url).then(function(){ event('share_done', {method:'clipboard'}); });
  }
}

/* ---------- debug panel ---------- */
var dbg = null;
function paintDebug(){
  if(!dbg || !dbg.classList.contains('on')) return;
  dbg.innerHTML = '<b>' + log.length + ' events · ' + mem.visitor + '</b>' +
    log.slice(-60).reverse().map(function(r){
      return '<div class="r">' + r.name + ' ' +
        JSON.stringify(r.props, function(k,v){
          return ['visitor','session','device','visit_no','returning'].indexOf(k) >= 0 ? undefined : v;
        }) + '</div>';
    }).join('');
}
function debug(){
  injectCSS();
  if(!dbg){ dbg = document.createElement('div'); dbg.id = 'tk-debug'; document.body.appendChild(dbg); }
  dbg.classList.toggle('on');
  paintDebug();
}
addEventListener('keydown', function(e){
  if(e.key === '`' || (e.key === 'D' && e.shiftKey && e.ctrlKey)) debug();
});

var PROBLEMS = [
{
  id:'p1451', no:'14.51', tab:'Point to a line',
  statement:'In right triangle $ABC$ the legs are $AC=15$ and $BC=20$, with the right angle at $C$. '
    +'A perpendicular $CM=5$ is erected to the plane of the triangle at $C$. '
    +'Find the distance from $M$ to the hypotenuse $AB$.',
  given:['$AC=15$','$BC=20$','$\\angle C=90^\\circ$','$CM=5$','$CM\\perp$ plane $ABC$'],
  ask:'distance from M to AB',
  known:[['A','C'],['B','C'],['C','M']],
  incomplete:'The figure shows only what the statement gives you: the triangle, and CM standing on it. '
    +'<b>The line you actually need is not drawn yet</b> \u2014 nothing here touches AB at a right angle. You will add it.',
  pts:function(){ return {A:[15,0,0], B:[0,20,0], C:[0,0,0], H:[9.6,7.2,0], M:[0,0,5]}; },
  wire:[['A','B'],['B','C'],['C','A'],['C','M']],
  target:['M','H'],
  tools:['Pythagoras','Area, two ways','Line \u22a5 plane'],
  steps:[
    { tool:'Pythagoras', t:'Get the hypotenuse',
      p:'Start flat. <b>ABC</b> is right-angled at C, and you know both legs.',
      tex:'AB=\\sqrt{15^2+20^2}=25', board:['A','C','B'], add:[['A','B','blue']], lens:[['A','B']],
      got:'AB = 25' },
    { tool:'Area, two ways', t:'Drop the height onto AB',
      ask:{q:'You want CH, the height onto AB. Which of these already contains CH?',
        opts:[
          {v:'The area of ABC',ok:true,
           why:'Yes. The area does not care which side you call the base \u2014 so writing it twice pins CH down.'},
          {v:'Triangle MCH',
           why:'It does contain CH \u2014 but to use it you would need MH, and MH is exactly what we are hunting. Something else has to give CH first.'},
          {v:'The hypotenuse AB',
           why:'AB is just a length. On its own it says nothing about how far C sits from it.'}]},
      p:'Call <b>H</b> the foot of the perpendicular from C to AB. The area of the triangle can be written two ways \u2014 and only one of them contains CH.',
      tex:'\\tfrac12\\cdot 15\\cdot 20=\\tfrac12\\cdot 25\\cdot CH\\;\\Rightarrow\\;CH=\\frac{300}{25}=12',
      board:['A','C','B'], add:[['C','H','blue']], lens:[['C','H']], got:'CH = 12' },
    { tool:'Line \u22a5 plane', t:'The right angle you cannot see',
      ask:{q:'Why is MH the distance from M to AB, rather than just some segment?',
        opts:[
          {v:'Because MH \u22a5 AB',ok:true,
           why:'Right. Distance to a line always means the perpendicular \u2014 and we can prove this one is perpendicular without seeing it.'},
          {v:'Because MH is the shortest we can draw',
           why:'True, but that is the consequence, not the reason. You need an argument that it is perpendicular.'},
          {v:'Because H is the midpoint of AB',
           why:'H is not the midpoint \u2014 it is the foot of the perpendicular from C. Different point.'}]},
      p:'CM is perpendicular to the whole plane, so it is perpendicular to <b>every</b> line in it \u2014 AB included. CH is perpendicular to AB too. So AB is perpendicular to the plane MCH, which makes <b>MH \u22a5 AB</b>.',
      note:'That is exactly what &ldquo;distance from M to AB&rdquo; means: the perpendicular.',
      board:null, add:[['M','H','red'],['M','C','amber']], got:'MH \u22a5 AB' },
    { tool:'Pythagoras', t:'Finish in the hidden triangle',
      p:'Triangle <b>MCH</b> is right-angled at C. Both legs are known.',
      tex:'MH^2=5^2+12^2=169', board:['M','C','H'], add:[], lens:[['M','H']], got:'MH = 13' }
  ],
  answer:'MH = 13',
  options:[{v:'13',ok:true},
           {v:'\\sqrt{194}\\approx 13.9',why:'That is \u221a(5\u00b2+13\u00b2) \u2014 looks like CH got mixed up with the hypotenuse AB. The height onto AB is 12, not 13.'},
           {v:'12',why:'That is CH, the distance from <b>C</b> to AB. M sits 5 above C, so it must be further away than that.'},
           {v:'5',why:'That is CM \u2014 how far M is from the <b>plane</b>. The question asks for its distance to a particular line in that plane.'}],
  why:'Notice what happened: two flat steps, then one idea about space, then one more flat step. None of it was hard on its own.'
},
{
  id:'p1457', no:'14.57', tab:'Point to a plane',
  statement:'In triangle $ABC$, $AB=29$, $BC=36$ and $AC=25$. A plane is drawn through $BC$, '
    +'making an angle $\\alpha$ with the plane of the triangle, where $\\sin\\alpha=\\tfrac{2}{5}$. '
    +'Find the distance from $A$ to that plane.',
  given:['$AB=29$','$BC=36$','$AC=25$','$\\sin\\alpha=\\tfrac{2}{5}$'],
  ask:'distance from A to the plane',
  known:[['A','B'],['B','C'],['A','C']],
  incomplete:'Only the triangle is given. <b>The tilted plane and the height onto BC are both missing</b> \u2014 '
    +'you draw them once you know where they go.',
  pts:function(){
    var sa=2/5, ca=Math.sqrt(1-sa*sa);          // sin a = 2/5
    // foot of the perpendicular from A onto the plane through BC tilted by a

          {v:'None \u2014 you need an angle first',

      tex:'d=AH\\sin\\alpha=20\\cdot\\tfrac{2}{5}=8',
      board:null, add:[['A','F','red']], lens:[['A','F']], got:'d = 8' }
  ],
  answer:'d = 8',
  options:[{v:'8',ok:true},
           {v:'20',why:'That is AH, the distance from A to <b>BC</b> inside the original plane. The new plane is tilted away from it.'},

  why:'The only spatial idea here was the last line. Everything before it was plane geometry you have done since school.'
},
{
  id:'p1458', no:'14.58', tab:'Two folded triangles',
  statement:'Two isosceles triangles share the common base $AB=16$, and their planes form an angle of $60^\\circ$. '
    +'The first has equal sides $17$ and $17$. In the second, the two equal sides are perpendicular to each other. '
    +'Find the distance between their apexes.',
  given:['$AB=16$','$PA=PB=17$','$QA\\perp QB$','planes at $60^\\circ$'],
  ask:'PQ',
  known:[['A','B'],['P','A'],['P','B']],
  incomplete:'Both triangles are here, but <b>nothing connects P to Q yet</b>, and neither height is drawn. '
    +'Those three lines are the whole solution.',
  pts:function(){ return {A:[-8,0,0], B:[8,0,0], M:[0,0,0],

  wire:[['A','B'],['A','P'],['B','P'],['A','Q'],['B','Q']],
  target:['P','Q'],
  tools:['Pythagoras','Right isosceles','Angle between planes','Law of cosines'],
  steps:[
    { tool:'Pythagoras', t:'Height of the first triangle',
      p:'<b>M</b> is the midpoint of AB, so AM = 8. The first triangle is isosceles, so PM is its height.',
      tex:'PM^2=17^2-8^2=225\\;\\Rightarrow\\;PM=15',
      board:['A','P','M'], add:[['P','M','blue']], lens:[['P','M']], got:'PM = 15' },
    { tool:'Right isosceles', t:'Height of the second',
      p:'QA and QB are equal <b>and</b> perpendicular, so AQB is a right isosceles triangle with hypotenuse AB. In one of those, the median to the hypotenuse is half of it.',
      tex:'QM=\\tfrac12 AB=8',
      board:['A','Q','M'], add:[['Q','M','blue']], lens:[['Q','M']], got:'QM = 8' },
    { tool:'Angle between planes', t:'Where the 60\u00b0 actually sits',
      ask:{q:'The planes meet at 60\u00b0. Between which two lines is that angle actually measured?',
        opts:[
          {v:'PM and QM',ok:true,
           why:'Yes. Both are perpendicular to the hinge AB, and that is exactly the definition.'},
          {v:'PA and QA',
           why:'Neither is perpendicular to AB, so the angle between them is not the angle between the planes.'},
          {v:'PQ and AB',
           why:'PQ is what we are looking for \u2014 it cannot be part of what we were given.'}]},
      p:'PM and QM are <b>both</b> perpendicular to AB, and AB is the hinge. That is the definition of the angle between the planes \u2014 so the angle at M, between PM and QM, is the 60\u00b0 you were given.',
      note:'This is the step people skip. The 60\u00b0 is not between any two random lines: it is between these two.',
      board:null, add:[], got:'\u2220PMQ = 60\u00b0' },
    { tool:'Law of cosines', t:'Two sides and the angle between them',
      p:'Triangle <b>PMQ</b> now has everything it needs.',
      tex:'PQ^2=15^2+8^2-2\\cdot15\\cdot8\\cos 60^\\circ=169',
      board:['P','M','Q'], add:[['P','Q','red']], lens:[['P','Q']], got:'PQ = 13' }

  answer:'PQ = 13',
  options:[{v:'13',ok:true},

           {v:'\\sqrt{409}\\approx 20.2',why:'Every piece is there, but the cosine term looks <b>added</b> rather than subtracted \u2014 that would be a 120\u00b0 fold, not 60\u00b0.'},

  why:'Three of the four steps were plane geometry. The whole spatial part was realising which angle the 60\u00b0 belonged to.'
},
{
  id:'p1459', no:'14.59', tab:'Across a fold',
  statement:'From points $A$ and $B$ lying on the two faces of a dihedral angle, perpendiculars '

  given:['$AA_1=3$','$BB_1=4$','$A_1B_1=5$','$x=60^\\circ$'],

  known:[['A','A1'],['B','B1'],['A1','B1']],
  incomplete:'Everything the statement mentions is drawn \u2014 and it is not enough. '

  wire:[['A','A1'],['B','B1'],['A1','B1']],
  target:['A','B'],
  tools:['Parallel translation','Law of cosines','Line \u22a5 plane','Pythagoras'],
  steps:[

      p:'In triangle <b>A\u2082B\u2081B</b> you know two sides, and the angle between them is the fold angle itself \u2014 because both of those segments are perpendicular to the edge.',
      tex:'A_2B^2=3^2+4^2-2\\cdot3\\cdot4\\cos60^\\circ=13',

  ],
  answer:'AB = \\sqrt{38}',
  options:[{v:'\\sqrt{38}',ok:true},
           {v:'\\sqrt{50}',why:'That is a\u00b2+b\u00b2+c\u00b2 \u2014 what you get when the cosine term vanishes, which only happens at a right fold. This one is 60\u00b0.'},

function tube(color,r,op){

function addSegments(list){

var orbit={theta:-58,phi:20,dist:34,target:new THREE.Vector3()};
var spin=true, zoomMul=1;
function frame(){
  var cx=0,cy=0,cz=0,n=0;
  for(var k in PT){ cx+=PT[k][0]; cy+=PT[k][1]; cz+=PT[k][2]; n++; }
  orbit.target.set(cx/n,cy/n,cz/n);
  var r=0; for(var k2 in PT){ r=Math.max(r,Math.hypot(PT[k2][0]-cx/n,PT[k2][1]-cy/n,PT[k2][2]-cz/n)); }
  orbit.dist=r/Math.sin(19*Math.PI/180)*1.25;
}
function applyOrbit(){
  var t=orbit.theta*Math.PI/180,p=orbit.phi*Math.PI/180,d=orbit.dist*zoomMul;
  camera.position.set(d*Math.cos(p)*Math.cos(t),d*Math.cos(p)*Math.sin(t),d*Math.sin(p)).add(orbit.target);
  camera.lookAt(orbit.target);
}
(function(){
  var pts={},n=0,lx=0,ly=0,pd=0;
  function d2(){var a=[];for(var k in pts)a.push(pts[k]);
    return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])||1;}
  stage.addEventListener('pointerdown',function(e){
    if(e.target.closest('.pin'))return;
    stage.setPointerCapture(e.pointerId); pts[e.pointerId]=[e.clientX,e.clientY]; n++;
    if(n===1){lx=e.clientX;ly=e.clientY;} else if(n===2) pd=d2();
    spin=false; document.getElementById('hint3d').style.opacity=0;
  });
  stage.addEventListener('pointermove',function(e){
    if(!pts[e.pointerId])return; pts[e.pointerId]=[e.clientX,e.clientY];

      orbit.phi=Math.max(-84,Math.min(84,orbit.phi+(e.clientY-ly)*.34)); lx=e.clientX; ly=e.clientY;}
    else if(n===2){var d=d2(); if(pd) zoomMul=Math.max(.6,Math.min(2.2,zoomMul*pd/d)); pd=d;}
  });
  function up(e){ if(pts[e.pointerId]){delete pts[e.pointerId]; n--;} }
  stage.addEventListener('pointerup',up); stage.addEventListener('pointercancel',up);
  stage.addEventListener('wheel',function(e){e.preventDefault();
    zoomMul=Math.max(.6,Math.min(2.2,zoomMul*(1+Math.sign(e.deltaY)*.1)));},{passive:false});

/* a point exists only once the statement gives it, or a step builds it */
function bornAt(){

  (LV.known||[]).forEach(function(e){ born[e[0]]=0; born[e[1]]=0; });
  LV.steps.forEach(function(st,i){
    function mark(k){ if(born[k]===undefined) born[k]=i+1; }
    (st.add||[]).forEach(function(x){ mark(x[0]); mark(x[1]); });
    (st.lens||[]).forEach(function(x){ mark(x[0]); mark(x[1]); });

}

var lenEls={}, knownLens=[], freshLen=null;
function keyOf(a,b){ return a<b ? a+'|'+b : b+'|'+a; }
function resetLens(){
  for(var k in lenEls){ lenEls[k].remove(); } lenEls={};
  knownLens=(LV.known||[]).map(function(e){return e;});

function addLens(list){
  list.forEach(function(e){
    if(knownLens.some(function(x){return keyOf(x[0],x[1])===keyOf(e[0],e[1]);})) return;
    knownLens.push(e); freshLen=keyOf(e[0],e[1]);

}
function syncLens(){
  var want={};

  for(var k in lenEls){ if(!want[k]){ lenEls[k].remove(); delete lenEls[k]; } }
  for(var k2 in want){
    var e=want[k2];
    if(!alive(e[0])||!alive(e[1])) continue;
    if(!lenEls[k2]){ var el=document.createElement('div'); layer.appendChild(el); lenEls[k2]=el; }
    var isTarget = keyOf(LV.target[0],LV.target[1])===k2;

    lenEls[k2].className='len'+(isTarget?' tgt':(isGiven?' given':''))+(freshLen===k2?' fresh':'');

/* turn $...$ into real math wherever it appears in prose */
function mathify(html){
  return html.replace(/\$([^$]+)\$/g, function(_,tex){
    return '<span data-tex="'+tex.replace(/"/g,'&quot;')+'"></span>';
  });
}
function typeset(root){
  if(typeof katex==='undefined'){ setTimeout(function(){typeset(root);},120); return; }
  var e=root.querySelectorAll('[data-tex]');
  for(var i=0;i<e.length;i++){ if(e[i].dataset.done) continue;
    try{ katex.render(e[i].dataset.tex,e[i],{throwOnError:false}); e[i].dataset.done=1; }
    catch(x){ e[i].textContent=e[i].dataset.tex; } }
}
function dist(p,q){ return Math.hypot(PT[p][0]-PT[q][0],PT[p][1]-PT[q][1],PT[p][2]-PT[q][2]); }
function nice(v){
  if(Math.abs(v-Math.round(v))<1e-9) return String(Math.round(v));
  var s=v*v; if(Math.abs(s-Math.round(s))<1e-7) return '\u221A'+Math.round(s);
  return v.toFixed(2);
}
function triSVG(keys,ink,bare){
  ink = ink || '#2340C4';
  // `bare` = the student's own board: label a side only if the statement gave it
  var a=keys[0],b=keys[1],c=keys[2];
  var L1=dist(a,b),L2=dist(b,c),L3=dist(c,a);
  var x3=(L1*L1+L3*L3-L2*L2)/(2*L1), y3=Math.sqrt(Math.max(0,L3*L3-x3*x3));
  var raw=[[0,0],[L1,0],[x3,y3]], W=320,H=180,P=40;
  var xs=raw.map(function(p){return p[0];}), ys=raw.map(function(p){return p[1];});
  var mnx=Math.min.apply(null,xs),mxx=Math.max.apply(null,xs);
  var mny=Math.min.apply(null,ys),mxy=Math.max.apply(null,ys);
  var sc=Math.min((W-2*P)/((mxx-mnx)||1),(H-2*P)/((mxy-mny)||1));
  var ox=(W-(mxx-mnx)*sc)/2-mnx*sc, oy=(H-(mxy-mny)*sc)/2-mny*sc;
  var q=raw.map(function(p){return [ox+p[0]*sc,H-(oy+p[1]*sc)];});
  var cen=[(q[0][0]+q[1][0]+q[2][0])/3,(q[0][1]+q[1][1]+q[2][1])/3];
  var o='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, monospace">';
  o+='<polygon points="'+q.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ')
    +'" fill="'+ink+'" fill-opacity=".07"/>';
  [[0,1,a,b],[1,2,b,c],[2,0,c,a]].forEach(function(e){
    var i=e[0],j=e[1];
    o+='<line x1="'+q[i][0].toFixed(1)+'" y1="'+q[i][1].toFixed(1)+'" x2="'+q[j][0].toFixed(1)
      +'" y2="'+q[j][1].toFixed(1)+'" stroke="'+ink+'" stroke-width="2" stroke-linecap="round"/>';
    var mx=(q[i][0]+q[j][0])/2,my=(q[i][1]+q[j][1])/2;
    var dx=mx-cen[0],dy=my-cen[1],dl=Math.hypot(dx,dy)||1;
    var label = bare ? givenLabel(e[2],e[3]) : nice(dist(e[2],e[3]));
    if(label){
      o+='<text x="'+(mx+dx/dl*15).toFixed(1)+'" y="'+(my+dy/dl*15+4).toFixed(1)
        +'" font-size="11.5" font-weight="600" fill="'+ink+'" text-anchor="middle">'+label+'</text>';
    }
  });
  // right-angle marker
  for(var i2=0;i2<3;i2++){
    var A=q[i2],B=q[(i2+1)%3],C2=q[(i2+2)%3];
    var u=[B[0]-A[0],B[1]-A[1]],v=[C2[0]-A[0],C2[1]-A[1]];
    var cs=(u[0]*v[0]+u[1]*v[1])/(Math.hypot(u[0],u[1])*Math.hypot(v[0],v[1]));
    if(Math.abs(cs)<1e-6){
      var s2=13,un=[u[0]/Math.hypot(u[0],u[1])*s2,u[1]/Math.hypot(u[0],u[1])*s2],
              vn=[v[0]/Math.hypot(v[0],v[1])*s2,v[1]/Math.hypot(v[0],v[1])*s2];
      o+='<path d="M'+(A[0]+un[0]).toFixed(1)+','+(A[1]+un[1]).toFixed(1)
        +' L'+(A[0]+un[0]+vn[0]).toFixed(1)+','+(A[1]+un[1]+vn[1]).toFixed(1)
        +' L'+(A[0]+vn[0]).toFixed(1)+','+(A[1]+vn[1]).toFixed(1)
        +'" fill="none" stroke="'+ink+'" stroke-width="1.4" opacity=".65"/>';
    }
  }
  q.forEach(function(p,i){
    var dx=p[0]-cen[0],dy=p[1]-cen[1],dl=Math.hypot(dx,dy)||1;
    o+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" fill="#14181A"/>';
    o+='<text x="'+(p[0]+dx/dl*17).toFixed(1)+'" y="'+(p[1]+dy/dl*17+4.5).toFixed(1)
      +'" font-size="12.5" font-weight="600" fill="#14181A" text-anchor="middle">'+nm(keys[i])+'</text>';
  });
  return o+'</svg>';
}

/* deterministic shuffle — stable within a session, but the right answer
   is not always the first one on the list */
function shuffled(arr, seed){
  var str=String(seed), h=1779033703^str.length;
  for(var i=0;i<str.length;i++){ h=Math.imul(h^str.charCodeAt(i),3432918353); h=h<<13|h>>>19; }
  function rnd(){ h=Math.imul(h^h>>>16,2246822507); h=Math.imul(h^h>>>13,3266489909);
    h^=h>>>16; return (h>>>0)/4294967296; }
  var out=arr.slice();
  for(var j=out.length-1;j>0;j--){
    var k=Math.floor(rnd()*(j+1)); var t=out[j]; out[j]=out[k]; out[k]=t;
  }
  return out;
}

function mountAsk(host, ask, idx){

  w.innerHTML='<p class="askhead">'+mathify(ask.q)+'</p><div class="askopts"></div>'
    +'<div class="askv"></div><button class="skip">Skip \u2014 just show me</button>';
  var box=w.querySelector('.askopts');
  shuffled(ask.opts, LV.id+idx).forEach(function(o,j){
    var b=document.createElement('button'); b.className='askopt'; b.innerHTML=mathify(o.v);
    b.onclick=function(){
      if(b.disabled) return;
      Track.event('step_question',{problem:LV.id,step:idx+1,correct:!!o.ok});
      var v=w.querySelector('.askv');
      if(o.ok){
        b.classList.add('right');
        [].forEach.call(box.children,function(x){x.disabled=true;});
        v.innerHTML='<div class="askgood">'+mathify(o.why)+'</div>'; typeset(v);
        setTimeout(function(){ answered[idx]=true; renderSteps(); renderAction(); },700);
      } else {
        b.disabled=true; b.classList.add('wrong');
        v.innerHTML='<div class="askbad">'+mathify(o.why)+'</div>'; typeset(v);
      }
    };
    box.appendChild(b);
  });
  typeset(w);
  w.querySelector('.skip').onclick=function(){
    Track.event('step_question_skip',{problem:LV.id,step:idx+1});
    answered[idx]=true; renderSteps(); renderAction();
  };
  host.appendChild(w);
}
function renderGate(){
  var g=document.getElementById('gate');
  attempts=0; tried=false;
  g.innerHTML='<p class="askq">Have a go first?</p>'
    +'<div class="doors">'
    +'<button class="door" id="dTry"><b>Let me try</b>'
      +'<span>Turn the figure, pull out triangles, then pick your answer.</span></button>'
    +'<button class="door" id="dWalk"><b>Walk me through it</b>'
      +'<span>One step at a time, collecting the tool each step needs.</span></button>'
    +'</div>';
  document.getElementById('dTry').onclick=function(){ Track.event('gate_choice',{problem:LV.id,choice:'try'}); showOptions(); };
  document.getElementById('dWalk').onclick=function(){ Track.event('gate_choice',{problem:LV.id,choice:'walk'}); startWalk(); };
  document.getElementById('belt').hidden=true;
  document.getElementById('go').style.display='none';
  document.getElementById('hintline').textContent='';
}
function showOptions(){
  tried=true;
  var g=document.getElementById('gate');
  g.innerHTML='<p class="askq">What did you get?</p><div class="opts" id="opts"></div>'
    +'<div id="verdict"></div>';
  var box=document.getElementById('opts');
  shuffled(LV.options, LV.id).forEach(function(o,i){
    var b=document.createElement('button'); b.className='opt';
    b.innerHTML='<span data-tex="'+o.v.replace(/"/g,'&quot;')+'"></span>';
    b.onclick=function(){ answer(o,b); };
    box.appendChild(b);
  });
  typeset(box);
  document.getElementById('hintline').textContent='Take your time. Pull out any triangle you like first.';
}
function answer(o,btn){
  if(btn.disabled) return;
  attempts++;
  Track.event('answer_pick',{problem:LV.id,correct:!!o.ok,attempt:attempts});
  var v=document.getElementById('verdict');
  if(o.ok){
    [].forEach.call(document.querySelectorAll('.opt'),function(b){b.disabled=true;});
    btn.classList.add('right');
    v.className=''; v.innerHTML='<div class="verdict good"><b>That is it.</b> '
      +(attempts===1?'First try.':'Got there.')+' Want to see whether your route matched ours?</div>';
    document.getElementById('go').style.display='';
    document.getElementById('go').className='btn';
    document.getElementById('go').textContent='Compare with our way';
    document.getElementById('hintline').textContent='';
    return;
  }
  btn.disabled=true; btn.classList.add('wrong');
  v.className='';
  v.innerHTML='<div class="verdict bad"><b>Not what we got.</b> Hard to say exactly where it went, but here is one thing that could have happened. '
    +mathify(o.why)+'</div>';
  typeset(v);
  if(attempts>=2){
    document.getElementById('go').style.display='';
    document.getElementById('go').className='btn';
    document.getElementById('go').textContent='Show me how it works';
    document.getElementById('hintline').textContent='';
  } else {
    document.getElementById('hintline').textContent='Try another one.';
  }
}
function startWalk(){
  document.getElementById('gate').innerHTML='';
  document.getElementById('belt').hidden=false;
  document.getElementById('go').style.display='';
  renderTools(); renderSteps(); renderAction();
}
function renderAction(){
  var b=document.getElementById('go'), h=document.getElementById('hintline');
  if(shown===0){
    b.className='btn'; b.disabled=false; b.textContent='Show me the first move';
    h.textContent='Or turn the figure and tap any three points first.';
  } else if(shown<LV.steps.length){
    var waiting = LV.steps[shown-1] && LV.steps[shown-1].ask && !answered[shown-1];
    b.className='btn'; b.disabled=!!waiting;
    b.textContent = waiting ? 'Answer above to carry on' : 'Next step';
    h.textContent = waiting ? '' : 'Step '+shown+' of '+LV.steps.length+' done.';
  } else {
    b.className='btn ghost'; b.disabled=false;
    var i=PROBLEMS.indexOf(LV);
    b.textContent = i+1<PROBLEMS.length ? 'Next problem: '+PROBLEMS[i+1].tab : 'Back to the start';
    h.textContent='';
  }
}
function advance(){
  if(shown>0 && LV.steps[shown-1].ask && !answered[shown-1]) return;
  if(shown>=LV.steps.length){
    var i=PROBLEMS.indexOf(LV);
    open(i+1<PROBLEMS.length ? i+1 : 0); return;
  }
  var s=LV.steps[shown];
  shown++;
  buildPins();
  buildTarget();
  if(s.add && s.add.length) addSegments(s.add);
  if(s.lens && s.lens.length) addLens(s.lens);
  if(LV.plane && shown>=LV.plane.at) showPlane();
  if(s.board) highlight(s.board); else highlight(null);
  spin=false;
  renderTools(); renderSteps(); renderAction();
  Track.event('step_reveal',{problem:LV.id,step:shown,tool:s.tool});
  if(shown===LV.steps.length){ finish(); }
  var st=document.getElementById('steps');
  if(st.lastChild) st.lastChild.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function finish(){
  done[LV.id]=1; renderPicker();
  var d=document.createElement('div'); d.className='final';
  d.innerHTML='<div class="lbl">answer</div><div class="ans"><span data-tex="'
    +LV.answer.replace(/"/g,'&quot;')+'"></span></div><p class="why">'+mathify(LV.why)+'</p>';
  document.getElementById('steps').appendChild(d); typeset(d);
  Track.event('problem_solved',{problem:LV.id});
  if(Object.keys(done).length===PROBLEMS.length) Track.complete({problems:PROBLEMS.length});

}

function open(i){
  LV=PROBLEMS[i]; PT=LV.pts(); shown=0; picks=[]; answered={}; userBoards=[];
  document.getElementById('title').textContent = i===0 ? 'Nothing here is hard.' : LV.tab+'.';
  renderPicker(); renderStatement();
  document.getElementById('steps').innerHTML='';
  document.getElementById('trayin').innerHTML='';
  document.getElementById('tray').hidden=true;
  renderGate();
  for(var pk in pinEls){ pinEls[pk].remove(); } pinEls={};
  BORN=bornAt();
  buildStructure(); buildPins(); buildTarget(); resetLens(); frame(); zoomMul=1; spin=true;
  try{ window.scrollTo({top:0,behavior:'smooth'}); }catch(e){}
  setTimeout(resize,30);
  Track.event('problem_open',{problem:LV.id,index:i+1});
}
document.getElementById('go').onclick=function(){
  if(document.getElementById('belt').hidden){ startWalk(); return; }
  advance();
};

/* rail */
window.__PART__='problem';
(function(){
  var ORDER=['explainer','problem','game'];
  var HREF={explainer:'cuboid.html',problem:'problems.html',game:'game.html'};
  var LABEL={explainer:'The box',problem:'Problems',game:'The puzzle'};
  var here=window.__PART__, dn=(Track.memory().parts)||{};
  var el=document.createElement('div'); el.id='rail';
  var html='<a class="home" href="index.html">&#8592; Sightlines</a><span class="track">';
  ORDER.forEach(function(k,i){
    var isDone=dn[k]&&dn[k].completed, isHere=(k===here);
    if(i) html+='<span class="seg'+((dn[ORDER[i-1]]&&dn[ORDER[i-1]].completed)?' done':'')+'"></span>';
    html+='<a class="node'+(isHere?' on':'')+(isDone&&!isHere?' done':'')+'" href="'+HREF[k]+'" title="'+LABEL[k]+'"></a>';
  });
  html+='</span><span class="now">Problems</span>';
  el.innerHTML=html; document.body.appendChild(el);
})();

Track.part('problem');
open(0); resize(); applyOrbit();
(function tick(){
  requestAnimationFrame(tick);
  if(spin) orbit.theta-=0.09;
  applyOrbit(); renderer.render(scene,camera); updatePins(); updateLens();
})();
setTimeout(function(){ document.getElementById('hint3d').style.opacity=0; },6000);
</script>
